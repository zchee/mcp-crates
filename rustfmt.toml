# Rust Edition & Style Guide
edition = "2024"
style_edition = "2024"
unstable_features = true

# Basic Layout
max_width = 100
use_small_heuristics = "Max"
newline_style = "Unix"

# Import Organization
# Separate `std`, external crates, and local modules (`crate::`, `super::`) with blank lines
group_imports = "StdExternalCrate"
# Merge imports from the same crate at the root level (e.g., `use crate::{a, b};`)
imports_granularity = "Crate"
reorder_imports = true
reorder_modules = true

# Documentation & Comment Formatting
format_code_in_doc_comments = true
doc_comment_code_block_width = 90
wrap_comments = true
comment_width = 90

# Code Structure & Idioms
format_strings = true
match_block_trailing_comma = true
reorder_impl_items = false # Keep false to preserve intentional implementation order
blank_lines_upper_bound = 1 # Limit consecutive blank lines to at most 1
