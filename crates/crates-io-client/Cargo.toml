[package]
name = "crates-io-client"
version = "0.1.0"
description = "Rate-limited, cache-aware read client for the crates.io API, sparse index, and docs.rs"
keywords = ["crates-io", "registry", "cargo", "docs-rs", "client"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
foldhash.workspace = true
htmd.workspace = true
itoa.workspace = true
moka.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zstd.workspace = true

[dev-dependencies]
divan.workspace = true
http.workspace = true
# The library stays allocator-agnostic; the benchmark installs the same
# allocator the server binary runs, so a checkpoint measures what ships.
mimalloc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

# divan supplies its own `main`, so the libtest harness is not linked in.
[[bench]]
name = "hot_paths"
harness = false

[lints]
workspace = true
