[workspace]
members = ["crates/crates-io-client", "crates/mcp-crates"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zchee/mcp-crates"

[workspace.dependencies]
crates-io-client = { version = "0.1.0", path = "crates/crates-io-client" }

bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
htmd = "0.5"
http = "1.5"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "gzip",
    "brotli",
    "zstd",
    "charset",
] }
rmcp = { version = "3.1", features = ["server", "macros", "transport-io"] }
schemars = "1.2"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "ansi",
    "std",
] }
url = "2.5"
zstd = "0.13"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# Proc-macro crates are dlopen'd by rustc during this same build, and a stripped
# dylib is unloadable on macOS ("mis-aligned LINKEDIT string pool"), so the
# release settings must not reach them.
[profile.release.build-override]
strip = false
codegen-units = 16
